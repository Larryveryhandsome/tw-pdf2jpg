<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 轉圖片｜tw-pdf2jpg</title>
<meta name="description" content="在瀏覽器裡把 PDF 轉成 JPG／PNG，檔案不上傳。">
<style>
:root{--ink:#1d2730;--muted:#66727c;--line:#dfe5ea;--bg:#f4f6f8;--card:#fff;--main:#2f6f8f;--ok:#e3f4ea;--okc:#1d6b3e;--err:#fbe6e6;--errc:#8b2323}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
main{max-width:860px;margin:0 auto;padding:28px 16px 60px}h1{margin:0 0 4px;font-size:1.6rem}.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.drop{border:2px dashed #9db6c4;border-radius:12px;padding:40px 16px;text-align:center;cursor:pointer;background:#f8fbfd}
.drop:hover,.drop.over,.drop:focus{border-color:var(--main);background:#eef5f9;outline:none}.drop b{font-size:1.1rem}
.file-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.file-name{font-weight:600;word-break:break-all}
.muted{color:var(--muted);font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:block;font-size:.9rem;font-weight:600}input,select{width:100%;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input[type=range]{padding:0}.btn{display:inline-block;border:0;border-radius:10px;background:var(--main);color:#fff;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:disabled{background:#a9b6be;cursor:not-allowed}.btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.small{padding:5px 12px;font-size:.85rem}
.link{border:0;background:none;color:var(--main);cursor:pointer;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}.progress div{height:100%;width:0;background:var(--main);transition:width .2s}
.status{margin-top:12px;padding:10px 12px;border-radius:8px;background:#eef2f5}.status.ok{background:var(--ok);color:var(--okc)}.status.error{background:var(--err);color:var(--errc)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.thumb{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.thumb img{width:100%;height:200px;object-fit:contain;background:#f1f1f1;border-radius:6px}.thumb figcaption{font-size:.8rem;word-break:break-all;margin:6px 0}
footer{color:var(--muted);font-size:.85rem;text-align:center;margin-top:24px}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>📄 PDF 轉圖片</h1>
  <p class="lead">把 PDF 每一頁轉成 JPG 或 PNG。<b>全部在你的瀏覽器裡處理，檔案不會上傳到任何伺服器。</b></p>

  <section class="card">
    <div class="drop" id="dropZone" tabindex="0" role="button" aria-label="選擇 PDF 檔">
      <b>把 PDF 拖到這裡，或點一下選檔</b><div class="muted">可以一次選好幾個</div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple hidden>
    <div id="fileList"></div>
  </section>

  <section class="card" id="options" hidden>
    <div class="grid">
      <label>格式
        <select id="format"><option value="jpg">JPG（檔案小，適合照片、掃描）</option><option value="png">PNG（無損，適合文字、線稿）</option></select>
      </label>
      <label>解析度
        <select id="dpi"><option value="96">96 DPI（螢幕看）</option><option value="150" selected>150 DPI（一般、LINE 傳送）</option><option value="200">200 DPI（清楚）</option><option value="300">300 DPI（列印）</option></select>
      </label>
      <label id="qualityRow">JPG 品質：<span id="qualityVal">92</span>
        <input type="range" id="quality" min="50" max="100" value="92">
      </label>
      <label>頁碼（空白＝全部）
        <input type="text" id="pages" placeholder="例：1-3, 5, 8-">
      </label>
    </div>
    <div class="row">
      <button class="btn" id="convertBtn" disabled>開始轉換</button>
      <button class="btn ghost" id="resetBtn">清除</button>
    </div>
    <div class="progress" id="progress" hidden><div id="bar"></div></div>
    <div class="status" id="status" hidden role="status"></div>
  </section>

  <section class="card" id="resultBar" hidden>
    <div class="row" style="margin:0 0 12px"><button class="btn" id="zipBtn">全部下載（ZIP）</button><span class="muted">或在下面一張一張下載</span></div>
    <div class="results" id="results"></div>
  </section>

  <footer>tw-pdf2jpg・Apache-2.0・使用 <a href="https://mozilla.github.io/pdf.js/">PDF.js</a> 與 <a href="https://stuk.github.io/jszip/">JSZip</a>・<a href="https://github.com/Larryveryhandsome/tw-pdf2jpg">原始碼</a></footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/pdf2img.js"></script>
<script src="js/app.js"></script>
</body>
</html>
